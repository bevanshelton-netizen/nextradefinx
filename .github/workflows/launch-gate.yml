name: NexAI Launch Gate

on:
  push:
    branches: [main, build/izakhono-global-ui, build/nexai-global-ui, build/nexai-real-ai, build/izakhono-invest-mvp]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Verify launch status contract
        run: |
          grep -q 'liveExecution: false' app/api/status/route.ts
          grep -q 'simulation: true' app/api/status/route.ts
          grep -q 'generateText' app/api/ai/route.ts
      - name: Create IZAKHONO owned release manifest
        shell: bash
        run: |
          mkdir -p release
          cat > release/izakhono-release.json <<EOF
          {
            "schema": "izakhono.release/v1",
            "product": "NexTradeFinX",
            "target": "IZAKHONO NODE",
            "source": "IZAKHONO CODE",
            "deployment": "IZAKHONO BUILDER -> IZAKHONO NODE / CONTROL",
            "revision": "${GITHUB_SHA}",
            "branch": "${GITHUB_REF_NAME}",
            "status": "deploy_ready",
            "public_live": false,
            "health": "/api/status",
            "simulation": true,
            "live_execution": false,
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
      - name: Package owned release
        run: tar -czf nextradefinx-owned-release.tar.gz --exclude=.git --exclude=node_modules --exclude=.next --exclude=release --exclude=nextradefinx-owned-release.tar.gz .
      - name: Upload owned release
        uses: actions/upload-artifact@v4
        with:
          name: nextradefinx-owned-release-${{ github.sha }}
          path: |
            nextradefinx-owned-release.tar.gz
            release/izakhono-release.json
          retention-days: 30

name: NexAI Launch Gate

on:
  push:
    branches: [main, build/nexai-global-ui, build/nexai-real-ai]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Verify launch status contract
        run: |
          grep -q 'liveExecution: false' app/api/status/route.ts
          grep -q 'simulation: true' app/api/status/route.ts
          grep -q 'generateText' app/api/ai/route.ts

  deploy-owned:
    name: Deploy to IZAKHONO owned runtime
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: self-hosted
    timeout-minutes: 20
    concurrency:
      group: nextradefinx-owned-production
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy and verify owned runtime
        shell: bash
        run: |
          chmod +x ops/nextradefinx-owned-deploy.sh
          ./ops/nextradefinx-owned-deploy.sh
